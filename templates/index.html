<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boulangerie Maison Dupont - Assistant Virtuel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #8B4513;
            --primary-light: #A0522D;
            --primary-dark: #654321;
            --accent: #D4A574;
            --accent-light: #F5E6D3;
            --bg: #FFF8F0;
            --bg-card: #FFFFFF;
            --text: #2C1810;
            --text-light: #6B5B4F;
            --border: #E8D5C4;
            --agent-bg: #F5E6D3;
            --user-bg: #8B4513;
            --user-text: #FFFFFF;
            --shadow: 0 2px 12px rgba(139, 69, 19, 0.08);
            --shadow-lg: 0 8px 32px rgba(139, 69, 19, 0.12);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: linear-gradient(135deg, var(--primary-dark), var(--primary));
            color: white;
            padding: 1rem 1.5rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            box-shadow: var(--shadow-lg);
            position: relative;
            z-index: 10;
        }

        .logo {
            width: 52px;
            height: 52px;
            background: var(--accent);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            flex-shrink: 0;
        }

        .header-text h1 {
            font-family: 'Playfair Display', serif;
            font-size: 1.3rem;
            font-weight: 600;
            letter-spacing: 0.02em;
        }

        .header-text p {
            font-size: 0.8rem;
            opacity: 0.85;
            margin-top: 2px;
        }

        .status {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            opacity: 0.9;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #4ADE80;
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            scroll-behavior: smooth;
        }

        .message {
            display: flex;
            gap: 0.75rem;
            max-width: 85%;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.agent {
            align-self: flex-start;
        }

        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            flex-shrink: 0;
        }

        .agent .avatar {
            background: var(--accent);
        }

        .user .avatar {
            background: var(--primary);
            color: white;
        }

        .bubble {
            padding: 0.85rem 1.1rem;
            border-radius: 1.1rem;
            line-height: 1.55;
            font-size: 0.92rem;
            white-space: pre-line;
        }

        .agent .bubble {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
            box-shadow: var(--shadow);
        }

        .user .bubble {
            background: var(--user-bg);
            color: var(--user-text);
            border-bottom-right-radius: 4px;
        }

        .typing-indicator {
            display: none;
            align-self: flex-start;
            gap: 0.75rem;
            align-items: center;
        }

        .typing-indicator.active {
            display: flex;
        }

        .typing-dots {
            display: flex;
            gap: 4px;
            padding: 0.85rem 1.1rem;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 1.1rem;
            border-bottom-left-radius: 4px;
            box-shadow: var(--shadow);
        }

        .typing-dots span {
            width: 7px;
            height: 7px;
            background: var(--accent);
            border-radius: 50%;
            animation: typing 1.4s ease-in-out infinite;
        }

        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-6px); }
        }

        .input-area {
            padding: 1rem 1.5rem;
            background: var(--bg-card);
            border-top: 1px solid var(--border);
            display: flex;
            gap: 0.75rem;
            align-items: flex-end;
        }

        .suggestions {
            padding: 0.5rem 1.5rem;
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            background: var(--bg);
        }

        .suggestion-btn {
            padding: 0.45rem 0.85rem;
            border: 1px solid var(--border);
            border-radius: 2rem;
            background: var(--bg-card);
            color: var(--text-light);
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }

        .suggestion-btn:hover {
            background: var(--accent-light);
            border-color: var(--accent);
            color: var(--primary);
        }

        #messageInput {
            flex: 1;
            padding: 0.8rem 1rem;
            border: 1.5px solid var(--border);
            border-radius: 1.5rem;
            font-size: 0.92rem;
            font-family: inherit;
            resize: none;
            outline: none;
            transition: border-color 0.2s;
            max-height: 120px;
            line-height: 1.4;
        }

        #messageInput:focus {
            border-color: var(--primary);
        }

        #sendBtn {
            width: 44px;
            height: 44px;
            border: none;
            background: var(--primary);
            color: white;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        #sendBtn:hover {
            background: var(--primary-light);
            transform: scale(1.05);
        }

        #sendBtn:disabled {
            background: var(--border);
            cursor: not-allowed;
            transform: none;
        }

        #sendBtn svg {
            width: 20px;
            height: 20px;
        }

        .welcome {
            text-align: center;
            padding: 2rem 1rem;
            color: var(--text-light);
        }

        .welcome h2 {
            font-family: 'Playfair Display', serif;
            color: var(--primary);
            margin-bottom: 0.5rem;
            font-size: 1.4rem;
        }

        .welcome p {
            font-size: 0.9rem;
            line-height: 1.5;
        }

        @media (max-width: 600px) {
            .message { max-width: 92%; }
            header { padding: 0.8rem 1rem; }
            .header-text h1 { font-size: 1.1rem; }
            .chat-container { padding: 1rem; }
            .input-area { padding: 0.75rem 1rem; }
            .suggestions { padding: 0.5rem 1rem; }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">🥖</div>
        <div class="header-text">
            <h1>Boulangerie Maison Dupont</h1>
            <p>Assistant virtuel - Depuis 1923</p>
        </div>
        <div class="status">
            <span class="status-dot"></span>
            En ligne
        </div>
    </header>

    <div class="chat-container" id="chatContainer">
        <div class="welcome">
            <h2>Bienvenue chez Maison Dupont</h2>
            <p>Je suis votre assistant virtuel.<br>Posez-moi vos questions sur nos produits, horaires, livraisons et plus !</p>
        </div>
    </div>

    <div class="suggestions" id="suggestions">
        <button class="suggestion-btn" onclick="sendSuggestion(this)">Quels sont vos horaires ?</button>
        <button class="suggestion-btn" onclick="sendSuggestion(this)">Voir le menu</button>
        <button class="suggestion-btn" onclick="sendSuggestion(this)">Prix des croissants</button>
        <button class="suggestion-btn" onclick="sendSuggestion(this)">Livraison a domicile</button>
        <button class="suggestion-btn" onclick="sendSuggestion(this)">Comment commander ?</button>
    </div>

    <div class="input-area">
        <textarea id="messageInput"
                  placeholder="Ecrivez votre message..."
                  rows="1"
                  autofocus></textarea>
        <button id="sendBtn" onclick="sendMessage()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
            </svg>
        </button>
    </div>

    <script>
        const chatContainer = document.getElementById('chatContainer');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const suggestions = document.getElementById('suggestions');

        messageInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 120) + 'px';
        });

        messageInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        function addMessage(text, role) {
            const msg = document.createElement('div');
            msg.className = `message ${role}`;
            const emoji = role === 'agent' ? '🥖' : '👤';
            msg.innerHTML = `
                <div class="avatar">${emoji}</div>
                <div class="bubble">${escapeHtml(text)}</div>
            `;
            chatContainer.appendChild(msg);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showTyping() {
            const indicator = document.createElement('div');
            indicator.className = 'typing-indicator active';
            indicator.id = 'typingIndicator';
            indicator.innerHTML = `
                <div class="avatar" style="background: var(--accent)">🥖</div>
                <div class="typing-dots">
                    <span></span><span></span><span></span>
                </div>
            `;
            chatContainer.appendChild(indicator);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function hideTyping() {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) indicator.remove();
        }

        async function sendMessage() {
            const message = messageInput.value.trim();
            if (!message) return;

            addMessage(message, 'user');
            messageInput.value = '';
            messageInput.style.height = 'auto';
            sendBtn.disabled = true;
            suggestions.style.display = 'none';

            showTyping();

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message }),
                });
                const data = await response.json();
                hideTyping();
                addMessage(data.reponse, 'agent');
            } catch (error) {
                hideTyping();
                addMessage(
                    "Desolee, une erreur est survenue. Veuillez reessayer.",
                    'agent'
                );
            }

            sendBtn.disabled = false;
            messageInput.focus();
        }

        function sendSuggestion(btn) {
            messageInput.value = btn.textContent;
            sendMessage();
        }
    </script>
</body>
</html>
