<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transformation 4 Semaines</title>
<style>
:root {
  --ground: #F5F6F8;
  --surface: #FFFFFF;
  --raised: #ECEEF2;
  --border: #D8DBE3;
  --border-subtle: #E8EAF0;
  --text: #1B1F27;
  --text-secondary: #5A6070;
  --text-dim: #8B8FA3;
  --accent: #4A7BF7;
  --accent-soft: rgba(74,123,247,0.09);
  --accent-mid: rgba(74,123,247,0.18);
  --done: #3DA35D;
  --done-soft: rgba(61,163,93,0.08);
  --done-border: rgba(61,163,93,0.35);
  --alert: #D4644A;
  --alert-soft: rgba(212,100,74,0.08);
  --warn: #C4973B;
  --warn-soft: rgba(196,151,59,0.08);
  --protocol: #7B61C2;
  --protocol-soft: rgba(123,97,194,0.08);
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
  --shadow: 0 2px 8px rgba(0,0,0,0.06);

  --font-mono: ui-monospace, 'Cascadia Code', 'Source Code Pro', 'SF Mono', Menlo, Monaco, 'Courier New', monospace;
  --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, 'Helvetica Neue', sans-serif;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #111318;
    --surface: #1C1F26;
    --raised: #262A33;
    --border: #2E333D;
    --border-subtle: #252930;
    --text: #DFE1E6;
    --text-secondary: #8B8FA3;
    --text-dim: #5A6070;
    --accent: #4A7BF7;
    --accent-soft: rgba(74,123,247,0.10);
    --accent-mid: rgba(74,123,247,0.20);
    --done: #3DA35D;
    --done-soft: rgba(61,163,93,0.08);
    --done-border: rgba(61,163,93,0.30);
    --alert: #D4644A;
    --alert-soft: rgba(212,100,74,0.10);
    --warn: #C4973B;
    --warn-soft: rgba(196,151,59,0.10);
    --protocol: #9B85D6;
    --protocol-soft: rgba(155,133,214,0.10);
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.2);
    --shadow: 0 2px 8px rgba(0,0,0,0.25);
  }
}

:root[data-theme="dark"] {
  --ground: #111318;
  --surface: #1C1F26;
  --raised: #262A33;
  --border: #2E333D;
  --border-subtle: #252930;
  --text: #DFE1E6;
  --text-secondary: #8B8FA3;
  --text-dim: #5A6070;
  --accent: #4A7BF7;
  --accent-soft: rgba(74,123,247,0.10);
  --accent-mid: rgba(74,123,247,0.20);
  --done: #3DA35D;
  --done-soft: rgba(61,163,93,0.08);
  --done-border: rgba(61,163,93,0.30);
  --alert: #D4644A;
  --alert-soft: rgba(212,100,74,0.10);
  --warn: #C4973B;
  --warn-soft: rgba(196,151,59,0.10);
  --protocol: #9B85D6;
  --protocol-soft: rgba(155,133,214,0.10);
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.2);
  --shadow: 0 2px 8px rgba(0,0,0,0.25);
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: var(--font-sans);
  background: var(--ground);
  color: var(--text);
  line-height: 1.55;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

.wrap {
  max-width: 720px;
  margin: 0 auto;
  padding: 0 16px 48px;
}

/* ── Header ── */
.site-header {
  padding: 28px 0 20px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 20px;
}

.site-header h1 {
  font-family: var(--font-mono);
  font-size: 1.15rem;
  font-weight: 600;
  letter-spacing: -0.02em;
  color: var(--text);
}

.site-header .tagline {
  font-family: var(--font-mono);
  font-size: 0.72rem;
  color: var(--text-dim);
  margin-top: 3px;
  letter-spacing: 0.02em;
}

/* ── Stats row ── */
.stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin-bottom: 20px;
}

.stat {
  background: var(--surface);
  border: 1px solid var(--border-subtle);
  border-radius: 8px;
  padding: 12px 10px;
  text-align: center;
  box-shadow: var(--shadow-sm);
}

.stat-val {
  font-family: var(--font-mono);
  font-size: 1.3rem;
  font-weight: 700;
  color: var(--accent);
  font-variant-numeric: tabular-nums;
}

.stat-lbl {
  font-family: var(--font-mono);
  font-size: 0.62rem;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-top: 2px;
}

/* ── Tabs ── */
.tabs {
  display: flex;
  gap: 2px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 20px;
  overflow-x: auto;
  scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }

.tab {
  font-family: var(--font-mono);
  font-size: 0.72rem;
  letter-spacing: 0.02em;
  padding: 10px 14px;
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  color: var(--text-dim);
  cursor: pointer;
  white-space: nowrap;
  transition: color 0.15s, border-color 0.15s;
}

.tab:hover { color: var(--text-secondary); }

.tab.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
}

/* ── Date nav ── */
.date-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
  padding: 0 2px;
}

.date-nav button {
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text-secondary);
  width: 30px;
  height: 30px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 0.85rem;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.15s;
  font-family: var(--font-sans);
}

.date-nav button:hover { background: var(--raised); }

.date-label {
  font-family: var(--font-mono);
  font-size: 0.82rem;
  color: var(--text);
  letter-spacing: -0.01em;
}

/* ── Time groups ── */
.time-group { margin-bottom: 20px; }

.tg-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 8px;
  padding-left: 2px;
}

.tg-time {
  font-family: var(--font-mono);
  font-size: 0.68rem;
  font-weight: 600;
  color: var(--accent);
  background: var(--accent-soft);
  padding: 2px 8px;
  border-radius: 4px;
  letter-spacing: 0.04em;
}

.tg-label {
  font-family: var(--font-mono);
  font-size: 0.68rem;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

/* ── Habit cards ── */
.habit {
  background: var(--surface);
  border: 1px solid var(--border-subtle);
  border-left: 3px solid var(--border);
  border-radius: 6px;
  padding: 14px 14px 14px 16px;
  margin-bottom: 6px;
  box-shadow: var(--shadow-sm);
  transition: border-left-color 0.25s, background 0.2s;
}

.habit.done {
  border-left-color: var(--done);
  background: var(--done-soft);
}

.habit-row {
  display: flex;
  align-items: center;
  gap: 12px;
}

.habit-icon {
  font-size: 1.1rem;
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 6px;
  flex-shrink: 0;
  background: var(--raised);
}

.habit.done .habit-icon { background: var(--done-soft); }

.habit-body { flex: 1; min-width: 0; }

.habit-name {
  font-family: var(--font-mono);
  font-size: 0.82rem;
  font-weight: 600;
  letter-spacing: -0.01em;
  display: flex;
  align-items: center;
  gap: 8px;
}

.habit-src {
  font-family: var(--font-sans);
  font-size: 0.62rem;
  color: var(--text-dim);
  font-weight: 400;
  flex-shrink: 0;
}

.habit-desc {
  font-size: 0.8rem;
  color: var(--text-secondary);
  margin-top: 1px;
  line-height: 1.45;
}

.check-btn {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  border: 2px solid var(--border);
  background: transparent;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: all 0.2s;
  color: transparent;
  font-size: 0.7rem;
}

.check-btn:hover { border-color: var(--text-dim); }

.check-btn.on {
  background: var(--done);
  border-color: var(--done);
  color: #fff;
}

.habit-detail {
  display: none;
  margin-top: 12px;
  padding-top: 10px;
  border-top: 1px solid var(--border-subtle);
}

.habit.open .habit-detail { display: block; }

.why-block {
  font-size: 0.78rem;
  color: var(--text-secondary);
  padding: 8px 12px;
  background: var(--accent-soft);
  border-left: 2px solid var(--accent);
  border-radius: 0 4px 4px 0;
  margin-bottom: 8px;
  line-height: 1.5;
}

.why-block strong {
  font-family: var(--font-mono);
  font-size: 0.68rem;
  color: var(--accent);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.example-block {
  font-size: 0.78rem;
  color: var(--text-secondary);
  padding: 8px 12px;
  background: var(--done-soft);
  border-left: 2px solid var(--done);
  border-radius: 0 4px 4px 0;
  margin-bottom: 8px;
  line-height: 1.5;
}

.note-field {
  width: 100%;
  background: var(--ground);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 8px 10px;
  color: var(--text);
  font-size: 0.8rem;
  font-family: var(--font-sans);
  resize: none;
  outline: none;
  transition: border-color 0.15s;
  line-height: 1.45;
}

.note-field:focus { border-color: var(--accent); }
.note-field::placeholder { color: var(--text-dim); }

.expand-btn {
  background: none;
  border: none;
  font-family: var(--font-mono);
  font-size: 0.68rem;
  color: var(--text-dim);
  cursor: pointer;
  padding: 4px 0;
  margin-top: 6px;
  letter-spacing: 0.02em;
}
.expand-btn:hover { color: var(--text-secondary); }

/* ── Weekly validation ── */
.week-card {
  background: var(--surface);
  border: 1px solid var(--border-subtle);
  border-radius: 8px;
  padding: 16px;
  margin-bottom: 10px;
  box-shadow: var(--shadow-sm);
}

.week-head {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 2px;
}

.week-head h3 {
  font-family: var(--font-mono);
  font-size: 0.85rem;
  font-weight: 600;
}

.wk-badge {
  font-family: var(--font-mono);
  font-size: 0.6rem;
  padding: 2px 8px;
  border-radius: 4px;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.wk-badge.now { background: var(--accent-soft); color: var(--accent); }
.wk-badge.past { background: var(--done-soft); color: var(--done); }
.wk-badge.next { background: var(--raised); color: var(--text-dim); }

.week-sub {
  font-size: 0.75rem;
  color: var(--text-dim);
  margin-bottom: 12px;
}

.criteria { list-style: none; }

.crit {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 0;
  border-top: 1px solid var(--border-subtle);
}

.crit:first-child { border-top: none; }

.crit-btn {
  width: 20px;
  height: 20px;
  border-radius: 4px;
  border: 2px solid var(--border);
  background: transparent;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: all 0.15s;
  color: transparent;
  font-size: 0.6rem;
}

.crit-btn.on {
  background: var(--done);
  border-color: var(--done);
  color: #fff;
}

.crit-text {
  font-size: 0.82rem;
  color: var(--text-secondary);
}

.crit-btn.on + .crit-text {
  text-decoration: line-through;
  color: var(--text-dim);
}

/* ── Charts ── */
.chart-card {
  background: var(--surface);
  border: 1px solid var(--border-subtle);
  border-radius: 8px;
  padding: 18px;
  margin-bottom: 12px;
  box-shadow: var(--shadow-sm);
}

.chart-card h3 {
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 600;
  letter-spacing: -0.01em;
  margin-bottom: 14px;
}

.ring-wrap {
  display: flex;
  justify-content: center;
  margin-bottom: 8px;
}

.bar-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 5px;
}

.bar-lbl {
  width: 100px;
  font-family: var(--font-mono);
  font-size: 0.7rem;
  color: var(--text-secondary);
  text-align: right;
  flex-shrink: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.bar-track {
  flex: 1;
  height: 18px;
  background: var(--raised);
  border-radius: 3px;
  overflow: hidden;
}

.bar-fill {
  height: 100%;
  border-radius: 3px;
  transition: width 0.5s ease;
}

.bar-pct {
  width: 36px;
  font-family: var(--font-mono);
  font-size: 0.7rem;
  color: var(--text-dim);
  font-variant-numeric: tabular-nums;
  flex-shrink: 0;
}

.week-cols {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
}

.wk-col {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}

.wk-col-pct {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  color: var(--text);
}

.wk-col-bar {
  width: 32px;
  height: 100px;
  background: var(--raised);
  border-radius: 4px;
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: flex-end;
}

.wk-col-fill {
  width: 100%;
  border-radius: 4px;
  transition: height 0.5s ease;
}

.wk-col-lbl {
  font-family: var(--font-mono);
  font-size: 0.68rem;
  color: var(--text-dim);
}

/* ── Recovery ── */
.recov-card {
  background: var(--surface);
  border: 1px solid var(--border-subtle);
  border-radius: 8px;
  padding: 16px;
  margin-bottom: 10px;
  box-shadow: var(--shadow-sm);
}

.recov-card h4 {
  font-family: var(--font-mono);
  font-size: 0.82rem;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 4px;
}

.sev {
  font-family: var(--font-mono);
  font-size: 0.58rem;
  padding: 2px 7px;
  border-radius: 3px;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.sev-low { background: var(--warn-soft); color: var(--warn); }
.sev-mid { background: var(--alert-soft); color: var(--alert); }
.sev-hi { background: rgba(212,100,74,0.15); color: var(--alert); }

.recov-sub {
  font-size: 0.78rem;
  color: var(--text-dim);
  margin-bottom: 8px;
}

.recov-list { list-style: none; }

.recov-list li {
  font-size: 0.82rem;
  color: var(--text-secondary);
  padding: 3px 0 3px 16px;
  position: relative;
}

.recov-list li::before {
  content: "\2192";
  position: absolute;
  left: 0;
  color: var(--accent);
  font-size: 0.75rem;
}

.note-box {
  background: var(--accent-soft);
  border: 1px solid var(--accent-mid);
  border-radius: 6px;
  padding: 12px 14px;
  margin-top: 8px;
}

.note-box p {
  font-size: 0.82rem;
  color: var(--text-secondary);
  line-height: 1.5;
}

.note-box strong {
  font-family: var(--font-mono);
  font-size: 0.72rem;
  color: var(--accent);
}

/* ── Anti-école ── */
.ae-section {
  background: var(--surface);
  border: 1px solid var(--protocol);
  border-radius: 8px;
  padding: 18px;
  margin-bottom: 14px;
  box-shadow: var(--shadow-sm);
}

.ae-section h3 {
  font-family: var(--font-mono);
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--protocol);
  margin-bottom: 4px;
}

.ae-section .ae-sub {
  font-size: 0.78rem;
  color: var(--text-dim);
  margin-bottom: 14px;
}

.ae-phase {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  padding: 10px 0;
  border-top: 1px solid var(--border-subtle);
}

.ae-phase:first-of-type { border-top: none; }

.ae-tag {
  font-family: var(--font-mono);
  font-size: 0.6rem;
  font-weight: 700;
  color: var(--protocol);
  background: var(--protocol-soft);
  padding: 3px 8px;
  border-radius: 3px;
  letter-spacing: 0.06em;
  white-space: nowrap;
  flex-shrink: 0;
  margin-top: 1px;
}

.ae-text {
  font-size: 0.82rem;
  color: var(--text-secondary);
  line-height: 1.5;
}

/* ── Sources ── */
.src-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
  gap: 8px;
}

.src-card {
  background: var(--surface);
  border: 1px solid var(--border-subtle);
  border-radius: 6px;
  padding: 10px 12px;
  box-shadow: var(--shadow-sm);
}

.src-num {
  font-family: var(--font-mono);
  font-size: 0.65rem;
  color: var(--text-dim);
  font-variant-numeric: tabular-nums;
}

.src-name {
  font-family: var(--font-mono);
  font-size: 0.82rem;
  font-weight: 600;
}

.src-work {
  font-size: 0.75rem;
  color: var(--accent);
}

.src-topic {
  font-size: 0.68rem;
  color: var(--text-dim);
  margin-top: 1px;
}

/* ── Guide ── */
.guide-card {
  background: var(--surface);
  border: 1px solid var(--border-subtle);
  border-radius: 8px;
  padding: 18px;
  margin-bottom: 12px;
  box-shadow: var(--shadow-sm);
}

.guide-card h3 {
  font-family: var(--font-mono);
  font-size: 0.82rem;
  font-weight: 600;
  margin-bottom: 14px;
}

.guide-app {
  padding: 12px 0;
  border-top: 1px solid var(--border-subtle);
}

.guide-app:first-of-type { border-top: none; }

.guide-app h4 {
  font-family: var(--font-mono);
  font-size: 0.82rem;
  font-weight: 600;
  margin-bottom: 2px;
}

.guide-app > p {
  font-size: 0.78rem;
  color: var(--text-dim);
  margin-bottom: 6px;
}

.steps { list-style: none; counter-reset: step; }

.steps li {
  font-size: 0.78rem;
  color: var(--text-secondary);
  padding: 2px 0 2px 22px;
  position: relative;
  counter-increment: step;
  line-height: 1.5;
}

.steps li::before {
  content: counter(step);
  position: absolute;
  left: 0;
  font-family: var(--font-mono);
  font-size: 0.65rem;
  font-weight: 700;
  color: var(--accent);
  width: 15px;
  text-align: right;
}

.reminder-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 0;
  border-top: 1px solid var(--border-subtle);
  font-size: 0.82rem;
}

.reminder-row:first-child { border-top: none; }

.reminder-time {
  font-family: var(--font-mono);
  font-size: 0.72rem;
  color: var(--accent);
  font-weight: 600;
}

.reminder-what { color: var(--text-secondary); }

/* ── Toast ── */
.toast {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%) translateY(60px);
  font-family: var(--font-mono);
  font-size: 0.78rem;
  background: var(--done);
  color: #fff;
  padding: 8px 20px;
  border-radius: 6px;
  opacity: 0;
  transition: all 0.25s ease;
  z-index: 100;
  pointer-events: none;
  letter-spacing: -0.01em;
}

.toast.show {
  transform: translateX(-50%) translateY(0);
  opacity: 1;
}

/* ── Responsive ── */
@media (max-width: 560px) {
  .stats { grid-template-columns: repeat(2, 1fr); }
  .tabs { gap: 0; }
  .tab { padding: 8px 10px; font-size: 0.68rem; }
  .bar-lbl { width: 66px; font-size: 0.62rem; }
  .src-grid { grid-template-columns: 1fr; }
  .habit-name { flex-wrap: wrap; }
  .habit-src { display: none; }
  .week-cols { gap: 8px; }
  .wk-col-bar { height: 80px; }
}
</style>
</head>
<body>

<div class="wrap">
  <header class="site-header">
    <h1>Transformation 4 Semaines</h1>
    <div class="tagline">17 sources / 8 habitudes / sciences du comportement</div>
  </header>

  <div class="stats" id="stats"></div>

  <nav class="tabs" id="tabs">
    <button class="tab active" data-t="daily">quotidien</button>
    <button class="tab" data-t="weekly">validation</button>
    <button class="tab" data-t="charts">graphiques</button>
    <button class="tab" data-t="recovery">rattrapage</button>
    <button class="tab" data-t="anti">anti-ecole</button>
    <button class="tab" data-t="sources">sources</button>
    <button class="tab" data-t="guide">config</button>
  </nav>

  <main id="main"></main>
</div>

<div class="toast" id="toast"></div>

<script>
const H = [
  { id:1, n:"Identite", cat:"matin", t:"08:00", src:"James Clear", desc:"Ecris une phrase d'identite + 1 intention.", why:"James Clear a dit : «Every action you take is a vote for the type of person you wish to become.»", ex:"Je suis ce type de personne. C'est normal pour moi de faire 1 action business/jour.", icon:"🪞", c:"#4A7BF7" },
  { id:2, n:"Corps", cat:"matin", t:"08:00", src:"BJ Fogg, CDC", desc:"Circuit 3 tours OU minimum vital (10 squats + 5 pompes + 20s gainage).", why:"BJ Fogg a dit que les petites actions repetees deviennent automatiques.", ex:null, icon:"💪", c:"#D4644A" },
  { id:3, n:"Image", cat:"matin", t:"08:00", src:"Amy Cuddy", desc:"Visage + dents + deo + vetements propres.", why:"Amy Cuddy a dit que la posture et l'apparence changent ta presence.", ex:null, icon:"👔", c:"#C4973B" },
  { id:4, n:"Anti-ecole", cat:"matin", t:"07:30", src:"Harvard, Stanford", desc:"1 respiration 4-6 + phrase «Je ne suis pas la pour etre comme eux.»", why:"Harvard a dit que la regle des 3 secondes coupe l'impulsivite. Stanford a dit que les cues declenchent les habitudes.", ex:null, icon:"🛡️", c:"#7B61C2" },
  { id:5, n:"Business", cat:"midi", t:"12:00", src:"Cal Newport, Ferriss", desc:"1 action business (message, relance, test d'offre).", why:"Cal Newport a dit que le travail profond et regulier est plus efficace que le «busy work».", ex:null, icon:"💼", c:"#3DA35D" },
  { id:6, n:"Environnement", cat:"midi", t:"12:00", src:"Stanford Lab", desc:"1 micro-action environnement (1 objet a sa place, 1 notification supprimee).", why:"Stanford a dit que l'environnement et les cues declenchent les habitudes.", ex:null, icon:"🏠", c:"#4A7BF7" },
  { id:7, n:"Mental", cat:"soir", t:"20:00", src:"Huberman, Dispenza", desc:"1 note de reaction/emotion (ex: «Aujourd'hui j'ai evite de justifier»).", why:"Huberman a dit que la reflexion consolide l'apprentissage. Dispenza a dit que la neuroplasticite permet de changer les habitudes.", ex:null, icon:"🧠", c:"#9B85D6" },
  { id:8, n:"Sommeil", cat:"soir", t:"20:00", src:"CDC, Sleep Foundation", desc:"7h minimum + ecrans reduits 30min avant.", why:"CDC a dit que 7h de sommeil minimum est crucial pour la sante.", ex:null, icon:"😴", c:"#4A7BF7" }
];

const WK = [
  { n:1, l:"Fondations", cr:["7 actions business realisees","7 actions corps realisees","7 phrases identite ecrites"] },
  { n:2, l:"Consolidation", cr:["Posture maintenue 7 jours","1 conversation business initiee","Regle des 3 secondes appliquee 3 fois"] },
  { n:3, l:"Expansion", cr:["1 reset utilise avec succes","7 alignements realises","1 apprentissage business note"] },
  { n:4, l:"Integration", cr:["8/10 criteres coches","1 temoignage ecrit","1 resultat business concret"] }
];

const SRC = [
  { n:"James Clear", w:"Atomic Habits", t:"Identite et habitudes" },
  { n:"BJ Fogg", w:"Tiny Habits", t:"Micro-habitudes" },
  { n:"Andrew Huberman", w:"Huberman Lab Podcast", t:"Neurosciences" },
  { n:"Stanford Behavior Design Lab", w:"Research", t:"Design comportemental" },
  { n:"Amy Cuddy", w:"TED Talk / Presence", t:"Posture et presence" },
  { n:"Harvard Study", w:"Impulsivity Research", t:"Regle des 3 secondes" },
  { n:"Cal Newport", w:"Deep Work", t:"Travail profond" },
  { n:"Princeton University", w:"Environment Research", t:"Environnement et cognition" },
  { n:"CDC", w:"Sleep Guidelines", t:"Sommeil et sante" },
  { n:"Carl Rogers", w:"Person-Centered Therapy", t:"Acceptation de soi" },
  { n:"UCL", w:"Habit Formation Study", t:"66 jours pour l'automaticite" },
  { n:"EHP", w:"Environmental Health Perspectives", t:"Impact environnemental" },
  { n:"PMC", w:"PubMed Central", t:"Recherche medicale" },
  { n:"Tim Ferriss", w:"4-Hour Work Week", t:"Productivite" },
  { n:"Joe Dispenza", w:"Breaking the Habit of Being Yourself", t:"Neuroplasticite" },
  { n:"Brene Brown", w:"Daring Greatly", t:"Vulnerabilite et courage" },
  { n:"Charles Duhigg", w:"The Power of Habit", t:"Boucle d'habitude" }
];

let curDate = new Date();
let curTab = 'daily';

const dk = d => d.toISOString().split('T')[0];
const load = () => { try { return JSON.parse(localStorage.getItem('t4s') || '{}'); } catch { return {}; } };
const save = d => localStorage.setItem('t4s', JSON.stringify(d));

function getDay(ds) {
  const d = load();
  if (!d[ds]) { d[ds] = { h:{}, no:{} }; H.forEach(h => { d[ds].h[h.id] = false; d[ds].no[h.id] = ''; }); save(d); }
  return d[ds];
}

function toggleH(ds, id) {
  const d = load(); if (!d[ds]) getDay(ds);
  d[ds].h[id] = !d[ds].h[id]; save(d); render();
  if (d[ds].h[id]) toast('Continue.');
}

function saveNote(ds, id, v) { const d = load(); if (!d[ds]) getDay(ds); d[ds].no[id] = v; save(d); }

function getWk(n) { try { return JSON.parse(localStorage.getItem('wk'+n) || '{}'); } catch { return {}; } }
function toggleWk(n, i) { const w = getWk(n); w[i] = !w[i]; localStorage.setItem('wk'+n, JSON.stringify(w)); render(); }

function initStart() {
  let s = localStorage.getItem('t4s_s');
  if (!s) { s = new Date().toISOString(); localStorage.setItem('t4s_s', s); }
  return new Date(s);
}

const startDate = initStart();

function curWeek() {
  const diff = Math.floor((new Date() - startDate) / 864e5);
  return Math.min(4, Math.max(1, Math.floor(diff/7)+1));
}

function dayProg(ds) {
  const day = getDay(ds);
  return Math.round(Object.values(day.h).filter(Boolean).length / H.length * 100);
}

function streak() {
  let s = 0, d = new Date();
  while(true) {
    const data = load(), key = dk(d);
    if (data[key]?.h && Object.values(data[key].h).filter(Boolean).length >= 6) { s++; d.setDate(d.getDate()-1); }
    else break;
  }
  return s;
}

function totalDone() {
  let t = 0;
  Object.values(load()).forEach(d => { if(d.h) t += Object.values(d.h).filter(Boolean).length; });
  return t;
}

function overallProg() {
  const data = load(), days = Object.keys(data);
  if (!days.length) return 0;
  let t = 0;
  days.forEach(d => { if(data[d].h) t += Object.values(data[d].h).filter(Boolean).length / H.length; });
  return Math.round(t / days.length * 100);
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 1800);
}

function fmtDate(d) {
  const dn = ['dim','lun','mar','mer','jeu','ven','sam'];
  const mn = ['jan','fev','mar','avr','mai','jun','jul','aou','sep','oct','nov','dec'];
  return `${dn[d.getDay()]} ${d.getDate()} ${mn[d.getMonth()]} ${d.getFullYear()}`;
}

function renderStats() {
  const ds = dk(curDate);
  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="stat-val">${dayProg(ds)}%</div><div class="stat-lbl">aujourd'hui</div></div>
    <div class="stat"><div class="stat-val">${streak()}</div><div class="stat-lbl">serie</div></div>
    <div class="stat"><div class="stat-val">${totalDone()}</div><div class="stat-lbl">total</div></div>
    <div class="stat"><div class="stat-val">S${curWeek()}</div><div class="stat-lbl">semaine</div></div>`;
}

function renderDaily() {
  const ds = dk(curDate), day = getDay(ds);
  const groups = { '07:30':{l:'matin tot',items:[]}, '08:00':{l:'matin',items:[]}, '12:00':{l:'midi',items:[]}, '20:00':{l:'soir',items:[]} };
  H.forEach(h => groups[h.t]?.items.push(h));

  let o = `<div class="date-nav">
    <button onclick="chgDate(-1)">‹</button>
    <span class="date-label">${fmtDate(curDate)}</span>
    <button onclick="chgDate(1)">›</button>
  </div>`;

  for (const [time, g] of Object.entries(groups)) {
    if (!g.items.length) continue;
    o += `<div class="time-group"><div class="tg-header">
      <span class="tg-time">${time}</span><span class="tg-label">${g.l}</span></div>`;
    g.items.forEach(h => {
      const done = day.h[h.id], note = day.no[h.id] || '';
      o += `<div class="habit${done?' done':''}" id="h${h.id}">
        <div class="habit-row">
          <div class="habit-icon">${h.icon}</div>
          <div class="habit-body">
            <div class="habit-name">${h.n} <span class="habit-src">${h.src}</span></div>
            <div class="habit-desc">${h.desc}</div>
          </div>
          <button class="check-btn${done?' on':''}" onclick="toggleH('${ds}',${h.id})">✓</button>
        </div>
        <button class="expand-btn" onclick="document.getElementById('h${h.id}').classList.toggle('open')">details + note ▾</button>
        <div class="habit-detail">
          <div class="why-block"><strong>pourquoi</strong><br>${h.why}</div>
          ${h.ex ? `<div class="example-block">${h.ex}</div>` : ''}
          <textarea class="note-field" rows="2" placeholder="Note du jour…" onchange="saveNote('${ds}',${h.id},this.value)">${note}</textarea>
        </div>
      </div>`;
    });
    o += '</div>';
  }
  document.getElementById('main').innerHTML = o;
}

function chgDate(d) { curDate.setDate(curDate.getDate()+d); render(); }

function renderWeekly() {
  const cw = curWeek();
  let o = '';
  WK.forEach(w => {
    const wd = getWk(w.n);
    const st = w.n < cw ? 'past' : w.n === cw ? 'now' : 'next';
    const stL = st === 'now' ? 'en cours' : st === 'past' ? 'fait' : 'a venir';
    const done = w.cr.filter((_,i) => wd[i]).length;
    o += `<div class="week-card"><div class="week-head"><h3>Semaine ${w.n}</h3><span class="wk-badge ${st}">${stL}</span></div>
      <div class="week-sub">${w.l} — ${Math.round(done/w.cr.length*100)}%</div>
      <ul class="criteria">`;
    w.cr.forEach((c,i) => {
      o += `<li class="crit"><button class="crit-btn${wd[i]?' on':''}" onclick="toggleWk(${w.n},${i})">✓</button><span class="crit-text">${c}</span></li>`;
    });
    o += '</ul></div>';
  });
  document.getElementById('main').innerHTML = o;
}

function renderCharts() {
  const overall = overallProg();
  const data = load(), days = Object.keys(data).sort().slice(-7);

  let bars = '';
  H.forEach(h => {
    let count = 0;
    days.forEach(d => { if(data[d]?.h?.[h.id]) count++; });
    const pct = days.length ? Math.round(count/days.length*100) : 0;
    bars += `<div class="bar-row"><span class="bar-lbl">${h.icon} ${h.n}</span><div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${h.c}"></div></div><span class="bar-pct">${pct}%</span></div>`;
  });

  let wcols = '';
  const wColors = ['#4A7BF7','#9B85D6','#3DA35D','#C4973B'];
  WK.forEach(w => {
    const wd = getWk(w.n);
    const done = w.cr.filter((_,i) => wd[i]).length;
    const pct = Math.round(done/w.cr.length*100);
    wcols += `<div class="wk-col"><span class="wk-col-pct">${pct}%</span><div class="wk-col-bar"><div class="wk-col-fill" style="height:${pct}%;background:${wColors[w.n-1]}"></div></div><span class="wk-col-lbl">S${w.n}</span></div>`;
  });

  const r = 54, circ = 2*Math.PI*r, off = circ - (overall/100)*circ;

  document.getElementById('main').innerHTML = `
    <div class="chart-card"><h3>progression globale</h3>
      <div class="ring-wrap">
        <svg width="130" height="130" viewBox="0 0 130 130">
          <circle cx="65" cy="65" r="${r}" fill="none" stroke="var(--border)" stroke-width="8"/>
          <circle cx="65" cy="65" r="${r}" fill="none" stroke="var(--accent)" stroke-width="8"
            stroke-dasharray="${circ}" stroke-dashoffset="${off}" stroke-linecap="round"
            transform="rotate(-90 65 65)" style="transition:stroke-dashoffset 0.6s ease"/>
          <text x="65" y="70" text-anchor="middle" font-family="var(--font-mono)" font-size="22" font-weight="700" fill="var(--text)">${overall}%</text>
        </svg>
      </div>
    </div>
    <div class="chart-card"><h3>items quotidiens (7 derniers jours)</h3><div>${bars}</div></div>
    <div class="chart-card"><h3>validation hebdomadaire</h3><div class="week-cols">${wcols}</div></div>`;
}

function renderRecovery() {
  document.getElementById('main').innerHTML = `
    <div class="recov-card"><h4>1 jour rate <span class="sev sev-low">facile</span></h4>
      <div class="recov-sub">Version minimale pour ne pas casser la chaine</div>
      <ul class="recov-list"><li>10 squats</li><li>5 pompes</li><li>20 secondes de gainage</li><li>1 action business (un message suffit)</li></ul></div>
    <div class="recov-card"><h4>3 jours rates <span class="sev sev-mid">modere</span></h4>
      <div class="recov-sub">Reprise progressive sur 3 jours</div>
      <ul class="recov-list"><li>Jour 1 : 1 seule action (la plus facile)</li><li>Jour 2 : 2 actions</li><li>Jour 3 : 3 actions, puis retour a la normale</li></ul></div>
    <div class="recov-card"><h4>7 jours rates <span class="sev sev-hi">reset</span></h4>
      <div class="recov-sub">Recommencer semaine 1 en version allegee</div>
      <ul class="recov-list"><li>4 items/jour uniquement (Identite + Corps + Business + Mental)</li><li>Pas de culpabilite — c'est le systeme qui fonctionne</li><li>Remonter progressivement a 8 items</li><li>Source : Carl Rogers — l'acceptation est le premier pas du changement</li></ul></div>
    <div class="note-box"><p><strong>rappel ucl</strong> — Il faut en moyenne 66 jours pour qu'un comportement devienne automatique. Rater quelques jours ne remet pas tout a zero. L'important est de reprendre, pas d'etre parfait.</p></div>`;
}

function renderAnti() {
  document.getElementById('main').innerHTML = `
    <div class="ae-section">
      <h3>Strategie Anti-ecole</h3>
      <div class="ae-sub">Protocole base sur Harvard (regle des 3s) et Stanford (cues comportementaux)</div>
      <div class="ae-phase"><span class="ae-tag">AVANT</span><span class="ae-text">1 respiration 4-6 (inspirer 4s, expirer 6s) + phrase : «Je ne suis pas la pour etre comme eux.»</span></div>
      <div class="ae-phase"><span class="ae-tag">PENDANT</span><span class="ae-text">Posture droite + regle des 3 secondes (ne pas reagir immediatement) + phrase : «Je suis occupe.»</span></div>
      <div class="ae-phase"><span class="ae-tag">APRES</span><span class="ae-text">1 note sur ce qui s'est passe + 1 action concrete (business ou environnement)</span></div>
      <div class="ae-phase"><span class="ae-tag">SI GLISSE</span><span class="ae-text">Reset immediat : 1 respiration 4-6 + 1 action minimale. Brene Brown dit que la vulnerabilite est un signe de force.</span></div>
    </div>
    <div class="guide-card"><h3>Sources de cette strategie</h3>
      <div class="guide-app"><h4>Harvard Study</h4><p>La regle des 3 secondes coupe l'impulsivite et permet de choisir une reponse plutot que de reagir.</p></div>
      <div class="guide-app"><h4>Stanford Behavior Design Lab</h4><p>Les cues environnementaux declenchent les habitudes — en changeant les cues, on change le comportement.</p></div>
      <div class="guide-app"><h4>Charles Duhigg</h4><p>La boucle d'habitude (cue → routine → recompense) peut etre reprogrammee avec une nouvelle routine.</p></div>
      <div class="guide-app"><h4>Brene Brown</h4><p>La vulnerabilite n'est pas une faiblesse — accepter ses moments de glisse est un acte de courage.</p></div>
    </div>`;
}

function renderSources() {
  let o = '<div class="src-grid">';
  SRC.forEach((s,i) => {
    o += `<div class="src-card"><div class="src-num">${String(i+1).padStart(2,'0')}</div><div class="src-name">${s.n}</div><div class="src-work">${s.w}</div><div class="src-topic">${s.t}</div></div>`;
  });
  o += '</div>';
  document.getElementById('main').innerHTML = o;
}

function renderGuide() {
  document.getElementById('main').innerHTML = `
    <div class="guide-card"><h3>Configuration par application</h3>
      <div class="guide-app"><h4>Lovable</h4><p>App personnalisee avec le prompt complet.</p>
        <ol class="steps"><li>Copier le fichier habits-config.json</li><li>Coller dans Lovable pour generer l'app</li><li>Personnaliser les couleurs et notifications</li><li>Deployer sur ton telephone</li></ol></div>
      <div class="guide-app"><h4>TickTick</h4><p>Habits + taches + rappels integres.</p>
        <ol class="steps"><li>Creer 8 habitudes dans l'onglet Habits</li><li>Configurer les rappels : 07:30, 08:00, 12:00, 20:00</li><li>Ajouter les descriptions comme notes</li><li>Creer une tache recurrente Validation hebdo chaque dimanche 20h</li><li>Utiliser les tags pour categoriser (matin/midi/soir)</li></ol></div>
      <div class="guide-app"><h4>Habitica</h4><p>Gamification + rappels.</p>
        <ol class="steps"><li>Creer 8 Daily tasks (pas Habits ni To-Dos)</li><li>Difficulte : Facile pour Image/Environnement, Moyen pour Corps/Business, Difficile pour Identite/Mental</li><li>Ajouter les Pourquoi dans les notes</li><li>Utiliser les checklists pour sous-actions (10 squats, 5 pompes, 20s gainage)</li><li>Configurer les rappels push</li></ol></div>
      <div class="guide-app"><h4>Loop Habit Tracker</h4><p>Simple, gratuit, avec graphiques integres (Android).</p>
        <ol class="steps"><li>Creer 8 habitudes Oui/Non, frequence quotidienne</li><li>Configurer les rappels individuels par habitude</li><li>Ajouter descriptions dans les notes</li><li>Utiliser histogramme + score pour le suivi</li><li>Export CSV pour analyse approfondie</li></ol></div>
      <div class="guide-app"><h4>Track &amp; Graph</h4><p>Graphiques detailles et personnalisables.</p>
        <ol class="steps"><li>Creer 8 trackers Oui/Non</li><li>Graphique ligne pour progression globale</li><li>Graphique barres pour les 8 items quotidiens</li><li>Graphique camembert pour validation hebdo</li><li>Rappels integres aux 4 horaires</li></ol></div>
    </div>
    <div class="guide-card"><h3>Rappels a configurer</h3>
      <div class="reminder-row"><span class="reminder-time">07:30</span><span class="reminder-what">Anti-ecole</span></div>
      <div class="reminder-row"><span class="reminder-time">08:00</span><span class="reminder-what">Identite + Corps + Image</span></div>
      <div class="reminder-row"><span class="reminder-time">12:00</span><span class="reminder-what">Business + Environnement</span></div>
      <div class="reminder-row"><span class="reminder-time">20:00</span><span class="reminder-what">Mental + Sommeil</span></div>
      <div class="reminder-row"><span class="reminder-time">dim 20:00</span><span class="reminder-what">Validation hebdomadaire</span></div>
    </div>`;
}

const views = { daily: renderDaily, weekly: renderWeekly, charts: renderCharts, recovery: renderRecovery, anti: renderAnti, sources: renderSources, guide: renderGuide };

function render() { renderStats(); if (views[curTab]) views[curTab](); }

document.getElementById('tabs').addEventListener('click', e => {
  if (!e.target.classList.contains('tab')) return;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  e.target.classList.add('active');
  curTab = e.target.dataset.t;
  render();
});

render();
</script>
</body>
</html>
